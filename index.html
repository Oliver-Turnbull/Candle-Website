<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Candle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Interactive Candle</h1>
      <p class="muted">Toggle the candle, change skins, adjust brightness/darkness, and play calming music.</p>
    </header>

    <section class="controls" aria-label="Candle controls">
      <button id="toggle-btn" class="btn" aria-pressed="true">Turn Off</button>

      <details class="options" aria-label="Options">
        <summary class="options-summary">Options ▾</summary>
        <div class="options-panel">
          <label class="control-row">
            <span>Skin</span>
            <select id="skin-select" aria-label="Select candle skin">
              <option value="classic">Classic (white)</option>
              <option value="striped">Striped</option>
              <option value="green">Green</option>
            </select>
          </label>

          <label class="control-row">
            <span>Upload Skin</span>
            <input id="skin-file" type="file" accept="image/*" />
            <button id="clear-skin" class="btn">Clear</button>
          </label>

          <label class="control-row">
            <span>Background Color</span>
            <input id="bg-color" type="color" value="#0b0f13" title="Background color" />
          </label>

          <label class="control-row">
            <span>Flame Brightness</span>
            <input id="brightness" type="range" min="0" max="1" step="0.01" value="1" />
          </label>

          <label class="control-row">
            <span>Scene Darkness</span>
            <input id="darkness" type="range" min="0" max="1" step="0.01" value="0.35" />
          </label>

          <label class="control-row">
            <span>Crackle</span>
            <input id="enable-crackle" type="checkbox" /> <small class="muted">Play crackle if no music</small>
          </label>

          <label class="control-row">
            <span>Fullscreen Candle</span>
            <input id="fullscreen-opt" type="checkbox" />
          </label>

          <div style="width:100%;display:flex;justify-content:flex-end;margin-top:6px">
            <button id="options-submit" class="btn">Apply</button>
          </div>

          <div class="music-controls" role="group" aria-label="Background music controls">
            <button id="music-toggle" class="btn">Play Music</button>
            <label class="control-row small">
              <span>Volume</span>
              <input id="music-vol" type="range" min="0" max="1" step="0.01" value="0.6" />
            </label>
          </div>
        </div>
      </details>
    </section>

    <section class="stage">
      <div id="scene" class="scene" aria-live="polite">
        <!-- darkness overlay -->
        <div id="overlay" class="overlay" aria-hidden="true"></div>

        <!-- candle container -->
        <div id="candle" class="candle classic" tabindex="0" role="button" aria-pressed="true" aria-label="Candle. Press to toggle.">
          <!-- flame (SVG) -->
          <svg id="flame" class="flame" viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <radialGradient id="flameGrad" cx="40%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#fff7c8" stop-opacity="1"/>
                <stop offset="40%" stop-color="#ffd88a" stop-opacity="1"/>
                <stop offset="100%" stop-color="#ff6a3d" stop-opacity="1"/>
              </radialGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- outer orange blob -->
            <path id="flame-shape" d="M50 5 C70 40, 65 70, 50 110 C35 70, 30 40, 50 5 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
            <!-- inner bright core -->
            <path id="flame-core" d="M50 18 C62 45, 60 60, 50 90 C40 60, 38 45, 50 18 Z" fill="#fff9d9" opacity="0.95"/>
          </svg>

          <!-- candle body (simple div, styled by CSS skins) -->
          <div class="body" aria-hidden="true"></div>

          <!-- wick -->
          <div class="wick" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <footer class="muted">
      Tip: Click the candle or press Space/Enter when focused to toggle.
    </footer>
  </main>

  <!-- Background music: replace src with your file at assets/relaxing.mp3 -->
  <audio id="bg-music" loop preload="auto">
    <source src="Rick-Roll-Sound-Effect.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Crackle sound (play when no music and enabled). Replace source with assets/crackle.mp3 -->
  <audio id="crackle" loop preload="auto">
    <source src="crackle-fireplace-campfire-402289.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script src="script.js"></script>
</body>
</html>
